<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Northwind Claims</title>
<style>body{font-family:system-ui,sans-serif;margin:40px;color:#111}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head>
<body>
<h1>My claims</h1>
<table id="claims"><thead><tr><th>Claim</th><th>Type</th><th>Amount</th><th>Status</th><th>Documents needed</th><th></th></tr></thead><tbody></tbody></table>
<script type="module">
import { formatCents, statusLabel } from '/format.js';
import { requiredDocuments, canWithdraw, withdrawClaim } from '/documents.js';
const rows = await (await fetch('/api/claims')).json();
document.querySelector('#claims tbody').innerHTML = rows.map(c =>
  `<tr><td>${c.id}</td><td>${c.type}</td><td>${formatCents(c.amountCents)}</td><td>${statusLabel(c.status)}</td><td>${requiredDocuments(c).join(', ')}</td>` +
  `<td>${canWithdraw(c) ? `<button data-withdraw="${c.id}">Withdraw</button>` : ''}</td></tr>`).join('');
document.querySelectorAll('[data-withdraw]').forEach(b => b.onclick = async () => {
  if (!confirm('Withdraw this claim?')) return;
  await withdrawClaim(b.dataset.withdraw);
  location.reload();
});
</script>
</body></html>
