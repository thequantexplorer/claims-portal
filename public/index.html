<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Northwind Claims</title>
<style>body{font-family:system-ui,sans-serif;margin:40px;color:#111}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head>
<body>
<h1>My claims</h1>
<p id="summary"></p>
<table id="claims"><thead><tr><th>Claim</th><th>Type</th><th>Amount</th><th>Status</th><th>Open for</th></tr></thead><tbody></tbody></table>
<script type="module">
import { formatCents, statusLabel } from '/format.js';
import { daysOpen, openClaims, outstandingCents } from '/claims.js';
const rows = await (await fetch('/api/claims')).json();
const open = openClaims(rows);
document.querySelector('#summary').textContent =
  `${open.length} open claim${open.length === 1 ? '' : 's'} · ${formatCents(outstandingCents(rows))} still to be paid`;
document.querySelector('#claims tbody').innerHTML = open.map(c =>
  `<tr><td>${c.id}</td><td>${c.type}</td><td>${formatCents(c.amountCents)}</td><td>${statusLabel(c.status)}</td><td>${daysOpen(c.submittedAt)} days</td></tr>`).join('');
</script>
</body></html>
