<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Northwind Claims</title>
<style>body{font-family:system-ui,sans-serif;margin:40px;color:#111}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head>
<body>
<h1>My claims</h1>
<p><input id="q" placeholder="Search claims"> <select id="status"><option value="">All statuses</option><option value="SUBMITTED">Received</option><option value="IN_REVIEW">In review</option><option value="APPROVED">Approved</option><option value="DENIED">Not approved</option><option value="PAID">Paid</option></select></p>
<table id="claims"><thead><tr><th>Claim</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody></tbody></table>
<script type="module">
import { formatCents, statusLabel } from '/format.js';
import { filterClaims, escapeHtml } from '/filters.js';
const rows = await (await fetch('/api/claims')).json();
const q = document.querySelector('#q'), status = document.querySelector('#status');
function render() {
  const shown = filterClaims(rows, { query: q.value, status: status.value });
  document.querySelector('#claims tbody').innerHTML = shown.length
    ? shown.map(c => `<tr><td>${escapeHtml(c.id)}</td><td>${escapeHtml(c.type)}</td><td>${formatCents(c.amountCents)}</td><td>${escapeHtml(statusLabel(c.status))}</td></tr>`).join('')
    : `<tr><td colspan="4">No claims match "${escapeHtml(q.value)}"</td></tr>`;
}
q.addEventListener('input', render);
status.addEventListener('change', render);
render();
</script>
</body></html>
