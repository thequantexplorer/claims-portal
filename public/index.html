<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Northwind Claims</title>
<style>body{font-family:system-ui,sans-serif;margin:40px;color:#111}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head>
<body>
<h1>My claims</h1>
<p><input id="q" type="search" placeholder="Search claims"> <a id="export" href="/export.csv">Export CSV</a> <span id="count"></span></p>
<table id="claims"><thead><tr><th>Claim</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody></tbody></table>
<script type="module">
import { formatCents, statusLabel } from '/format.js';
import { filterClaims, describeResults } from '/search.js';
const rows = await (await fetch('/api/claims')).json();
const q = document.querySelector('#q');
function render() {
  const shown = filterClaims(rows, q.value);
  document.querySelector('#claims tbody').innerHTML = shown.map(c =>
    `<tr><td>${c.id}</td><td>${c.type}</td><td>${formatCents(c.amountCents)}</td><td>${statusLabel(c.status)}</td></tr>`).join('');
  document.querySelector('#count').textContent = describeResults(shown.length, rows.length);
  document.querySelector('#export').href = '/export.csv?q=' + q.value;
}
q.addEventListener('input', render);
render();
</script>
</body></html>
