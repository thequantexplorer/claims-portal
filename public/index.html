<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Northwind Claims</title>
<style>body{font-family:system-ui,sans-serif;margin:40px;color:#111}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head>
<body>
<h1>My claims</h1>
<table id="claims"><thead><tr><th>Claim</th><th>Filed</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody></tbody></table>
<script type="module">
import { formatCents, statusLabel, formatFiledDate } from '/format.js';
const rows = await (await fetch('/api/claims')).json();
rows.sort((a, b) => b.filedAt - a.filedAt);
document.querySelector('#claims tbody').innerHTML = rows.map(c =>
  `<tr><td>${c.id}</td><td>${formatFiledDate(c.filedAt)}</td><td>${c.type}</td><td>${formatCents(c.amountCents)}</td><td>${statusLabel(c.status)}</td></tr>`).join('');
</script>
</body></html>
